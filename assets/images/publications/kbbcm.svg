<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">KbBcM visual abstract</title><desc id="desc">Lag-penalty attention and posterior residual correction remove delayed reactions from a daily water-demand forecast.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#765b69"/><stop offset="1" stop-color="#b31b1b"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315d73"/></marker></defs>
  <rect width="800" height="500" rx="10" fill="#f8fafc"/><text x="58" y="54" fill="#75828c" font-family="monospace" font-size="18">VISUAL ABSTRACT 02</text>
  <path d="M56 300 C95 245 128 350 170 270S250 185 292 262" fill="none" stroke="#c9d4db" stroke-width="6"/><path d="M74 329 C115 275 147 375 190 295S269 210 310 287" fill="none" stroke="#b31b1b" stroke-width="6" stroke-dasharray="11 8"/>
  <path d="M320 270H374" stroke="#315d73" stroke-width="5" marker-end="url(#a)"/><rect x="386" y="137" width="160" height="210" rx="22" fill="#eef2f6" stroke="url(#g)" stroke-width="3"/>
  <text x="466" y="190" text-anchor="middle" fill="#1f2933" font-family="sans-serif" font-size="23" font-weight="700">BI-CORRECTION</text><text x="466" y="224" text-anchor="middle" fill="#66737d" font-family="monospace" font-size="14">LAG PENALTY</text><text x="466" y="251" text-anchor="middle" fill="#66737d" font-family="monospace" font-size="14">AR + STACKED LSTM</text><text x="466" y="278" text-anchor="middle" fill="#66737d" font-family="monospace" font-size="14">POSTERIOR ERROR</text>
  <path d="M546 243H596" stroke="#315d73" stroke-width="5" marker-end="url(#a)"/><path d="M610 293 C649 238 681 343 724 263" fill="none" stroke="#4f7770" stroke-width="8"/><circle cx="610" cy="293" r="7" fill="#4f7770"/><circle cx="724" cy="263" r="7" fill="#4f7770"/>
  <text x="56" y="396" fill="#66737d" font-family="monospace" font-size="15">DELAYED RESPONSE</text><text x="603" y="396" fill="#4f7770" font-family="monospace" font-size="15">TIMELY TURN</text><text x="58" y="438" fill="#1f2933" font-family="sans-serif" font-size="25" font-weight="700">Correct the timing, not only the average error.</text>
