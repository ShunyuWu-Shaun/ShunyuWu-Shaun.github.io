<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">CritiCoder visual abstract</title><desc id="desc">A Coder learns the pressure response to measured variables while a Critic represents residual variation from unobserved disturbances.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5268C2"/></marker></defs>
  <rect width="800" height="500" rx="10" fill="#F8FAFC"/><text x="58" y="54" fill="#7B8790" font-family="monospace" font-size="18">VISUAL ABSTRACT 03</text>
  <g fill="#E3E8EB" stroke="#7B8790"><rect x="48" y="126" width="184" height="86" rx="18"/><rect x="48" y="279" width="184" height="86" rx="18"/></g><text x="140" y="162" text-anchor="middle" fill="#37424B" font-family="sans-serif" font-size="17" font-weight="700">MEASURED INPUTS</text><text x="140" y="188" text-anchor="middle" fill="#5F6B75" font-family="monospace" font-size="14">FLOW / DEMAND</text><text x="140" y="315" text-anchor="middle" fill="#37424B" font-family="sans-serif" font-size="18" font-weight="700">DISTURBANCE</text><text x="140" y="341" text-anchor="middle" fill="#C96862" font-family="monospace" font-size="14">UNOBSERVED</text>
  <path d="M232 169H300" stroke="#5268C2" stroke-width="5" marker-end="url(#a)"/><path d="M232 322H300" stroke="#5268C2" stroke-width="5" marker-end="url(#a)"/><rect x="312" y="115" width="174" height="112" rx="22" fill="#DDE2F5" stroke="#5268C2" stroke-width="3"/><rect x="312" y="269" width="174" height="112" rx="22" fill="#F5DAD7" stroke="#C96862" stroke-width="3"/><text x="399" y="164" text-anchor="middle" fill="#37424B" font-family="sans-serif" font-size="25" font-weight="700">CODER</text><text x="399" y="194" text-anchor="middle" fill="#5268C2" font-family="monospace" font-size="14">OBSERVED RESPONSE</text><text x="399" y="318" text-anchor="middle" fill="#37424B" font-family="sans-serif" font-size="25" font-weight="700">CRITIC</text><text x="399" y="348" text-anchor="middle" fill="#C96862" font-family="monospace" font-size="14">UNCERTAIN RESIDUAL</text>
