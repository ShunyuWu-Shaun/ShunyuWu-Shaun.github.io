  <rect width="800" height="500" rx="30" fill="#0b1020"/><text x="58" y="54" fill="#91a0c9" font-family="monospace" font-size="18">VISUAL ABSTRACT 03</text>
  <g fill="#131d39" stroke="#3b4a74"><rect x="55" y="126" width="166" height="86" rx="18"/><rect x="55" y="279" width="166" height="86" rx="18"/></g><text x="138" y="162" text-anchor="middle" fill="#f5f7f2" font-family="sans-serif" font-size="18" font-weight="700">MEASURED INPUTS</text><text x="138" y="188" text-anchor="middle" fill="#9eacd0" font-family="monospace" font-size="13">FLOW / DEMAND</text><text x="138" y="315" text-anchor="middle" fill="#f5f7f2" font-family="sans-serif" font-size="18" font-weight="700">DISTURBANCE</text><text x="138" y="341" text-anchor="middle" fill="#ff816f" font-family="monospace" font-size="13">UNOBSERVED</text>
  <path d="M221 169H300M221 322H300" stroke="#5de4ff" stroke-width="5" marker-end="url(#a)"/><g fill="#151e38" stroke="url(#g)" stroke-width="3"><rect x="312" y="115" width="174" height="112" rx="22"/><rect x="312" y="269" width="174" height="112" rx="22"/></g><text x="399" y="164" text-anchor="middle" fill="#f5f7f2" font-family="sans-serif" font-size="26" font-weight="700">CODER</text><text x="399" y="194" text-anchor="middle" fill="#9eacd0" font-family="monospace" font-size="13">OBSERVED RESPONSE</text><text x="399" y="318" text-anchor="middle" fill="#f5f7f2" font-family="sans-serif" font-size="26" font-weight="700">CRITIC</text><text x="399" y="348" text-anchor="middle" fill="#9eacd0" font-family="monospace" font-size="13">UNCERTAIN RESIDUAL</text>
