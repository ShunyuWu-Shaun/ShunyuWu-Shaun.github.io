<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">KbBcM visual abstract</title><desc id="desc">Lag-penalty attention and posterior residual correction remove delayed reactions from a daily water-demand forecast.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7357ff"/><stop offset="1" stop-color="#ff5a44"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5de4ff"/></marker></defs>
  <rect width="800" height="500" rx="30" fill="#0b1020"/><text x="58" y="54" fill="#91a0c9" font-family="monospace" font-size="18">VISUAL ABSTRACT 02</text>
  <path d="M56 300 C95 245 128 350 170 270S250 185 292 262" fill="none" stroke="#667496" stroke-width="6"/><path d="M74 329 C115 275 147 375 190 295S269 210 310 287" fill="none" stroke="#ff5a44" stroke-width="6" stroke-dasharray="11 8"/>
  <path d="M320 270H374" stroke="#5de4ff" stroke-width="5" marker-end="url(#a)"/><rect x="386" y="137" width="160" height="210" rx="22" fill="#141d38" stroke="url(#g)" stroke-width="3"/>
  <text x="466" y="190" text-anchor="middle" fill="#f5f7f2" font-family="sans-serif" font-size="23" font-weight="700">BI-CORRECTION</text><text x="466" y="224" text-anchor="middle" fill="#b5c1e0" font-family="monospace" font-size="14">LAG PENALTY</text><text x="466" y="251" text-anchor="middle" fill="#b5c1e0" font-family="monospace" font-size="14">AR + STACKED LSTM</text><text x="466" y="278" text-anchor="middle" fill="#b5c1e0" font-family="monospace" font-size="14">POSTERIOR ERROR</text>
  <path d="M546 243H596" stroke="#5de4ff" stroke-width="5" marker-end="url(#a)"/><path d="M610 293 C649 238 681 343 724 263" fill="none" stroke="#3cc9b7" stroke-width="8"/><circle cx="610" cy="293" r="7" fill="#3cc9b7"/><circle cx="724" cy="263" r="7" fill="#3cc9b7"/>
  <text x="56" y="396" fill="#9eacd0" font-family="monospace" font-size="15">DELAYED RESPONSE</text><text x="603" y="396" fill="#3cc9b7" font-family="monospace" font-size="15">TIMELY TURN</text><text x="58" y="438" fill="#f5f7f2" font-family="sans-serif" font-size="25" font-weight="700">Correct the timing, not only the average error.</text>
</svg>
