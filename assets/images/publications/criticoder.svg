  <text x="668" y="401" text-anchor="middle" fill="#37424B" font-family="sans-serif" font-size="18" font-weight="700">PRESSURE</text><text x="668" y="424" text-anchor="middle" fill="#C96862" font-family="sans-serif" font-size="18" font-weight="700">+ UNCERTAINTY</text>
</svg>
